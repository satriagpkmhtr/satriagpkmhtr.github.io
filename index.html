<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
            color: #1e293b;
            margin: 0;
            padding: 30px;
        }

        h1, h2, h3 {
            color: #1d4ed8;
            text-align: center;
        }

        p {
            font-size: 16px;
            line-height: 1.8;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 6px 15px #00000020;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #1e40af;
            text-decoration: underline;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1e40af;
            transform: translateY(-2px);
        }
    </style>
</head>
