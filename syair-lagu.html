<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Video YouTube</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f0e8;
            color: #333;
        }

        header {
            background: #6b1f2b;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 10px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .video-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .video-box iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 10px;
        }

        .description {
            text-align: center;
            margin-top: 25px;
        }

        footer {
            text-align: center;
            background: #6b1f2b;
            color: white;
            padding: 20px;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            .video-box iframe {
                height: 250px;
            }

            header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Video Saya</h1>
        <p>Tonton video YouTube di bawah ini</p>
    </header>

    <div class="container">

        <div class="video-box">

            <iframe

                <p>

                </p>
            </div>

        </div>

    </div>

    <footer>
        <p>© 2026 Website Saya</p>
    </footer>

</body>
</html>
